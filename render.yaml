# Render Blueprint - Despliegue API Minuto a Minuto
# Conecte este repo en render.com y se creará el servicio automáticamente
services:
  - type: web
    name: api-minuto-a-minuto
    runtime: docker
    rootDir: api
    healthCheckPath: /test
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: APP_DEBUG
        value: "1"
