services:
  - type: web
    name: api-minuto-a-minuto-node
    runtime: node
    rootDir: api-node
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "1433"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_ENCRYPT
        value: "false"
      - key: DB_TRUST_SERVER_CERT
        value: "true"
      - key: DB_CONNECT_TIMEOUT
        value: "30000"
      - key: DB_REQUEST_TIMEOUT
        value: "30000"
